<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zoyas.visuals — personalizowane animowane prezenty AI oraz kreatywny marketing i content.">
  <title>Zoyas.visuals | Animowane prezenty i marketing</title>
  <style>
    :root{color-scheme:light;--bg:#faf6f0;--ink:#302326;--muted:#695b5d;--wine:#713a4a;--line:#e5d9d3;--card:#fffdfb}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    a{color:inherit}button{font:inherit;cursor:pointer}header,main,footer{max-width:1080px;margin:auto;padding:24px}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;letter-spacing:.02em;text-decoration:none;font-size:1.25rem}
    .langs{display:flex;gap:8px}.langs button{border:1px solid var(--line);border-radius:100px;padding:6px 14px;background:white}.langs button[aria-pressed="true"]{background:var(--wine);color:white}
    .hero{padding:72px 0 56px;max-width:780px}.eyebrow{color:var(--wine);font-size:.85rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.12;letter-spacing:-.045em;margin:16px 0}h2{font-size:clamp(1.7rem,3.5vw,2.5rem);line-height:1.2}h3{margin:0 0 8px;font-size:1.25rem}
    p{margin:0 0 18px}.lead{font-size:1.15rem;color:var(--muted)}.button{display:inline-block;background:var(--wine);color:white;text-decoration:none;border-radius:12px;padding:12px 20px;font-weight:650;border:0}
    section{margin:0 0 76px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.card p{color:var(--muted)}
    .note{border-left:3px solid var(--wine);padding:12px 16px;background:#f2e9e5;border-radius:0 10px 10px 0}.placeholder{background:#e8d9d4;border-radius:12px;aspect-ratio:16/9;display:grid;place-items:center;color:#604951;margin-bottom:18px;text-align:center;padding:16px}
    footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}.footerlinks{display:flex;flex-wrap:wrap;gap:16px}.footerlinks a{color:var(--wine)}
    [hidden]{display:none!important}@media(max-width:700px){header,main,footer{padding:18px}.hero{padding:48px 0}.grid{grid-template-columns:1fr}section{margin-bottom:52px}}
  </style>
</head>
<body>
<header><a class="brand" href="#top">Zoyas.visuals</a><div class="langs" role="group" aria-label="Language / Язык"><button type="button" data-lang="pl" aria-pressed="true">PL</button><button type="button" data-lang="ru" aria-pressed="false">RU</button></div></header>
<main id="top">
  <section class="hero"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="heroTitle"></h1><p class="lead" data-i18n="heroText"></p><a class="button" href="#gifts" data-i18n="viewGifts"></a></section>
  <section id="gifts"><h2 data-i18n="giftsTitle"></h2><p class="lead" data-i18n="giftsText"></p><div class="grid">
    <article class="card"><div class="placeholder" data-i18n="videoSoon"></div><h3 data-i18n="gift1"></h3><p data-i18n="gift1desc"></p></article>
    <article class="card"><div class="placeholder" data-i18n="videoSoon"></div><h3 data-i18n="gift2"></h3><p data-i18n="gift2desc"></p></article>
    <article class="card"><div class="placeholder" data-i18n="videoSoon"></div><h3 data-i18n="gift3"></h3><p data-i18n="gift3desc"></p></article>
  </div></section>
  <section id="seasonal"><h2 data-i18n="seasonTitle"></h2><p data-i18n="seasonText"></p></section>
  <section id="marketing"><h2 data-i18n="marketingTitle"></h2><p class="lead" data-i18n="marketingText"></p><div class="card"><h3 data-i18n="marketingServices"></h3><p data-i18n="marketingDetails"></p></div></section>
  <section id="contact"><h2 data-i18n="contactTitle"></h2><p data-i18n="contactText"></p><p class="note" data-i18n="contactPending"></p></section>
</main>
<footer><p>© <span id="year">2026</span> Zoyas.visuals</p><div class="footerlinks"><span data-i18n="privacyPending"></span></div></footer>
<script>
'use strict';
const translations={
 pl:{eyebrow:'Studio personalizowanych prezentów',heroTitle:'Wyjątkowe historie dla wyjątkowych osób',heroText:'Tworzę personalizowane animacje i bajki AI na urodziny, święta i inne radosne okazje.',viewGifts:'Zobacz formaty prezentów',giftsTitle:'Animowane prezenty',giftsText:'Wybierz format dopasowany do okazji.',videoSoon:'Miejsce na przykład wideo',gift1:'Animowana kartka · 10 s',gift1desc:'Krótka, personalizowana animacja z życzeniami.',gift2:'Bajka z bohaterem · 40 s',gift2desc:'Gotowa historia z dopasowaną postacią chłopca lub dziewczynki.',gift3:'Bajka na zamówienie · 1–2 min',gift3desc:'Indywidualna historia tworzona od podstaw.',seasonTitle:'Oferta sezonowa',seasonText:'Świąteczne historie i animacje. Ten dział można wyłączyć po sezonie.',marketingTitle:'Marketing i content',marketingText:'Strategia, social media i teksty dla marek.',marketingServices:'Wsparcie kreatywne i strategiczne',marketingDetails:'Strategia marketingowa, SMM, copywriting oraz scenariusze do wideo.',contactTitle:'Kontakt',contactText:'Wkrótce tutaj pojawią się linki do Instagramu i Telegrama.',contactPending:'Zamówienia przez stronę nie są jeszcze aktywne.',privacyPending:'Informacje prawne i polityka prywatności — w przygotowaniu.'},
 ru:{eyebrow:'Студия персональных подарков',heroTitle:'Особенные истории для близких людей',heroText:'Создаю персональные AI-мультфильмы и анимационные поздравления ко дню рождения, праздникам и другим радостным событиям.',viewGifts:'Посмотреть форматы подарков',giftsTitle:'Анимационные подарки',giftsText:'Выбери формат под свой повод.',videoSoon:'Место для примера видео',gift1:'Видеооткрытка · 10 сек.',gift1desc:'Короткое персональное анимационное поздравление.',gift2:'Сказка с героем · 40 сек.',gift2desc:'Готовая история с заменой персонажа на мальчика или девочку.',gift3:'Мультфильм на заказ · 1–2 мин.',gift3desc:'Индивидуальная история, созданная с нуля.',seasonTitle:'Сезонные предложения',seasonText:'Новогодние и праздничные истории. После сезона этот раздел можно отключить.',marketingTitle:'Маркетинг и контент',marketingText:'Стратегия, социальные сети и тексты для брендов.',marketingServices:'Креативная и стратегическая поддержка',marketingDetails:'Маркетинговая стратегия, SMM, копирайтинг и сценарии для видео.',contactTitle:'Контакты',contactText:'Скоро здесь появятся ссылки на Instagram и Telegram.',contactPending:'Заказы через сайт пока не принимаются.',privacyPending:'Юридическая информация и политика конфиденциальности — в подготовке.'}
};
function setLanguage(lang){if(!Object.hasOwn(translations,lang))lang='pl';document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=translations[lang][el.dataset.i18n]||''});document.querySelectorAll('[data-lang]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.lang===lang)));document.title=lang==='pl'?'Zoyas.visuals | Animowane prezenty i marketing':'Zoyas.visuals | Анимационные подарки и маркетинг';}
document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));
document.getElementById('year').textContent=String(new Date().getFullYear());setLanguage('pl');
</script>
</body>
</html>
